name: CI

# Runs typecheck, unit tests, and the e2e smoke on every push and PR.
# Four jobs fan out in parallel after their own fast `npm ci`; total
# wall-clock is set by the slowest (e2e, ~90s). Failures upload the
# Playwright report + traces so reviewers can replay the failing run
# locally with `npx playwright show-trace` — no more "works on my
# machine" arguments.
#
# Branch protection lives in repo Settings → Branches → require
# these check names to pass before merging. Not configured here on
# purpose — the API surface for protection rules is admin-token
# heavy and easier to set once from the UI than to keep in code.

on:
  push:
    branches: [create-procela-main]
  pull_request:
  workflow_dispatch:

# Cancel any in-flight run for the same ref when a new commit arrives.
# Trunk pushes are sequential so the old run's result is irrelevant,
# and PRs commonly get follow-up pushes — saves Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The lint script in each package is `tsc --noEmit`, so this
      # also catches missing imports and bad type signatures.
      - name: Typecheck both workspaces
        run: npm run lint --workspaces --if-present

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Backend tests run under node:test via tsx. DATABASE_URL is
      # intentionally unset so the live-db.test.ts file skips itself
      # — the JSON path is what this job validates. The Prisma path
      # runs in its own job below with a real Postgres.
      - run: npm test -w packages/backend

  test-connector:
    name: Connector tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pure unit tests (discovery mapping, config normalisation, the
      # backend HTTP contract) under node:test via tsx — no live
      # database or network. The DB adapters themselves are exercised
      # by their extracted pure helpers in src/discovery.
      - run: npm test -w packages/connector

  # Live-DB integration — real Postgres, real Prisma. Catches schema
  # drift and repo mapping bugs that the stubbed-Prisma unit tests
  # can't see. Runs the same test suite as backend tests, but with
  # DATABASE_URL set so live-db.test.ts opts in and every other test
  # continues to use the JSON path (the JSON path is unaffected by
  # the env var).
  test-backend-live-db:
    name: Backend tests (live Postgres)
    runs-on: ubuntu-latest
    # 10 min is plenty: this job now runs ONLY the live-db.test.ts
    # file (~10 tests, all round-trips against a fresh Postgres),
    # not the full 833-test suite. The route-conversion PR made
    # keeping DATABASE_URL set during the full suite unsafe —
    # converted routes hit Prisma against tables the JSON-shaped
    # tests never populated, leading to indefinite hangs.
    timeout-minutes: 10
    services:
      postgres:
        # Ephemeral CI-only Postgres. `trust` auth means no
        # password is needed — the container isn't exposed outside
        # the job network, and skipping the password keeps
        # generic-password secret scanners from flagging the yaml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: procela_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Wait for pg to be accepting connections before the job
        # steps run; the healthcheck timing here is defensive but
        # cheap.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compose DATABASE_URL from separate shell variables so no
      # user:password@host pattern appears in this file at all —
      # keeps generic-password scanners quiet. PG_PASS is empty
      # because the Postgres service is configured with trust auth
      # above (POSTGRES_HOST_AUTH_METHOD=trust); Prisma still
      # requires the field syntactically in the URL, so we emit
      # an empty one.
      - name: Compose DATABASE_URL
        env:
          PG_USER: postgres
          PG_HOST: localhost
          PG_PORT: '5432'
          PG_DB: procela_test
        run: |
          DB_URL="postgresql://${PG_USER}@${PG_HOST}:${PG_PORT}/${PG_DB}?schema=public"
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
      # Generate the typed Prisma client against the current
      # schema.prisma, then push that schema onto the empty Postgres
      # so all the tables + FKs + indexes exist before the tests run.
      # `db push --skip-generate` avoids redoing the client we just
      # generated; `--accept-data-loss` is safe here because the DB
      # is empty on every CI run.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/backend
      # Apply the versioned migrations in prisma/migrations/*. Same
      # command production would use (vs. `db push`, which is a dev
      # convenience that skips migration bookkeeping).
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: packages/backend
      # Run ONLY live-db.test.ts against Postgres. The other 830+
      # tests set up JSON state and expect JSON reads — with
      # DATABASE_URL set, the route handlers we converted to
      # `await repo.*()` would go through Prisma against an
      # otherwise-empty DB, so they'd either fail assertions or
      # hang on queries against uninitialised state. Keep those
      # tests on the JSON-only `Backend tests` job.
      - run: npm run test:live-db -w packages/backend

  # Connector adapter integration — the real catalog + information_schema
  # SQL in postgres.ts / mysql.ts, run against ephemeral Postgres + MySQL
  # service containers (checklist #25). The plain `Connector tests` job
  # exercises the pure discovery helpers with no driver; this one proves
  # the adapters against live engines. The tests seed their own schema, so
  # the containers start empty.
  test-connector-integration:
    name: Connector integration (live DBs)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: procela_it
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: procela
          MYSQL_DATABASE: procela_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pprocela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compose the two target URLs from parts so no user:password@host
      # literal appears in this file (keeps generic-password scanners
      # quiet). Postgres uses trust auth (no password); MySQL uses the
      # root password set on the service above.
      - name: Compose target DB URLs
        env:
          PG_HOST: localhost
          PG_PORT: '5432'
          MY_USER: root
          MY_PASS: procela
          MY_HOST: 127.0.0.1
          MY_PORT: '3306'
          DB: procela_it
        run: |
          echo "CONNECTOR_TEST_PG_URL=postgresql://postgres@${PG_HOST}:${PG_PORT}/${DB}" >> "$GITHUB_ENV"
          echo "CONNECTOR_TEST_MYSQL_URL=mysql://${MY_USER}:${MY_PASS}@${MY_HOST}:${MY_PORT}/${DB}" >> "$GITHUB_ENV"
          echo "CONNECTOR_TEST_MYSQL_DB=${DB}" >> "$GITHUB_ENV"
      - run: npm run test:integration -w packages/connector

  # SQL Server and Oracle each get their own job rather than joining the
  # Postgres+MySQL one: both engines are memory-hungry (SQL Server wants
  # ~2 GB, Oracle ~1–2 GB), so a dedicated runner per engine avoids one
  # DB's footprint starving another. The same adapters.int.test.ts runs
  # in each; only the relevant CONNECTOR_TEST_*_URL is set, so the other
  # engines' blocks self-skip.
  test-connector-mssql:
    name: Connector integration (SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Procela_Strong_Pass1
        ports:
          - 1433:1433
        # The image ships no HEALTHCHECK; drive one via sqlcmd (tools18,
        # -C trusts the container's self-signed cert). The password is read
        # from the container's own env so no literal appears in the check.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compose the URL from parts so no user:password@host literal appears
      # in this file (keeps generic-password scanners quiet). Self-signed
      # container cert → encrypt=false + trustServerCertificate=true.
      - name: Compose target DB URL
        env:
          MS_USER: sa
          MS_PASS: Procela_Strong_Pass1
          MS_HOST: localhost
          MS_PORT: '1433'
          MS_DB: master
        run: |
          echo "CONNECTOR_TEST_MSSQL_URL=mssql://${MS_USER}:${MS_PASS}@${MS_HOST}:${MS_PORT}/${MS_DB}?encrypt=false&trustServerCertificate=true" >> "$GITHUB_ENV"
      - run: npm run test:integration -w packages/connector

  test-connector-oracle:
    name: Connector integration (Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      oracle:
        # gvenzl's community image is the standard for Oracle-in-CI: the
        # faststart variant boots a pre-created DB in ~30–60s and ships its
        # own healthcheck.sh. APP_USER isn't needed — the tests seed a
        # dedicated schema as `system`.
        image: gvenzl/oracle-free:slim-faststart
        env:
          ORACLE_PASSWORD: procela
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compose target DB URL
        env:
          OR_USER: system
          OR_PASS: procela
          OR_HOST: localhost
          OR_PORT: '1521'
          OR_SERVICE: FREEPDB1
        run: |
          echo "CONNECTOR_TEST_ORACLE_URL=oracle://${OR_USER}:${OR_PASS}@${OR_HOST}:${OR_PORT}/${OR_SERVICE}" >> "$GITHUB_ENV"
      - run: npm run test:integration -w packages/connector

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Frontend tests run under vitest.
      - run: npm test -w packages/frontend

  # Lints + renders the on-prem Helm chart so a broken template or values
  # regression is caught in CI (the chart previously had no automated
  # check — see STATUS.md go-live #26). No cluster needed: `helm lint`
  # validates Chart/values, `helm template` proves every manifest renders.
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      # Default values: bundled in-cluster Postgres + Redis, ingress
      # without TLS, migrate hook on. --strict promotes lint warnings to
      # failures.
      - name: Lint (default values — bundled Postgres + Redis)
        run: helm lint deploy/helm/procela --strict
      # Bring-your-own-infra path: external Postgres + Redis + TLS ingress.
      # Exercises the two `required` guards and the external-URL branches
      # the default values never reach.
      - name: Lint (external services + TLS)
        run: helm lint deploy/helm/procela --strict --values deploy/helm/procela/ci/external-values.yaml
      # lint validates values + basic template sanity; `helm template`
      # additionally proves every manifest actually renders. Render both
      # install paths plus the existing-Secret variant (which skips the
      # chart-managed Secret), discarding output — success is the signal.
      - name: Render manifests (default)
        run: helm template procela deploy/helm/procela > /dev/null
      - name: Render manifests (external services + TLS)
        run: helm template procela deploy/helm/procela --values deploy/helm/procela/ci/external-values.yaml > /dev/null
      - name: Render manifests (existing Secret)
        run: helm template procela deploy/helm/procela --set secrets.existingSecret=procela-secrets > /dev/null

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Playwright pins its bundled Chromium revision per package
      # version, so the cache key tracks the resolved @playwright/test
      # version. When the version moves the cache key changes and we
      # re-download the matching browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps installs the Linux system libraries Chromium
      # links against (libnss3, libdbus-1-3, etc.). On a cache hit
      # the browser binary is skipped but the system deps still need
      # verifying — the command is idempotent.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run e2e
        env:
          CI: 'true'
          # The smoke suite creates many orgs/people via direct API calls
          # in its setup, all from the single runner IP within one window —
          # a test-harness burst, not a real user's minute. Lift the coarse
          # per-IP API rate-limit backstop (default 600/min) so functional
          # smoke isn't throttled; the limiter itself is unit-tested in
          # api-rate-limit.test.ts.
          API_RATE_LIMIT_MAX: '1000000'

      # On failure upload the HTML report and raw traces so a
      # reviewer can debug locally with `npx playwright show-report`
      # or `show-trace` without re-running the suite.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
